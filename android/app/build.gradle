apply plugin: 'com.android.application'

def sajraVersionCode = (project.findProperty('sajraVersionCode') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def sajraVersionName = project.findProperty('sajraVersionName') ?: "1.0.${sajraVersionCode}"
def releaseStoreFile = System.getenv('SAJRA_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('SAJRA_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('SAJRA_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SAJRA_RELEASE_KEY_PASSWORD')

android {
    namespace = "com.sajra.familytree"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sajra.familytree"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode sajraVersionCode
        versionName sajraVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
repositories { flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // AppNotificationsPlugin.java uses FirebaseMessaging directly. The push-notifications
    // Capacitor plugin only depends on it as "implementation", which doesn't expose the class
    // to this module, so it has to be declared here too or the build fails to compile.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    // AppMessagingService.java builds notifications with NotificationCompat and sets the app
    // badge with ShortcutBadger directly - same "implementation isn't transitive" reason as above.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "me.leolin:ShortcutBadger:$shortcutBadgerVersion@aar"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}
apply from: 'capacitor.build.gradle'
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) apply plugin: 'com.google.gms.google-services'
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
