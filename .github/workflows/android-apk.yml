name: Build Sajra Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'index.html'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SAJRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.SAJRA_RELEASE_KEYSTORE_BASE64 }}
      SAJRA_RELEASE_STORE_PASSWORD: ${{ secrets.SAJRA_RELEASE_STORE_PASSWORD }}
      SAJRA_RELEASE_KEY_ALIAS: ${{ secrets.SAJRA_RELEASE_KEY_ALIAS }}
      SAJRA_RELEASE_KEY_PASSWORD: ${{ secrets.SAJRA_RELEASE_KEY_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npm run build:android
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug -PsajraVersionCode=${{ github.run_number }} -PsajraVersionName=1.0.${{ github.run_number }}
      - name: Decode release keystore
        if: ${{ env.SAJRA_RELEASE_KEYSTORE_BASE64 != '' && env.SAJRA_RELEASE_STORE_PASSWORD != '' && env.SAJRA_RELEASE_KEY_ALIAS != '' && env.SAJRA_RELEASE_KEY_PASSWORD != '' }}
        run: |
          echo "$SAJRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sajra-release.jks"
          echo "SAJRA_RELEASE_STORE_FILE=$RUNNER_TEMP/sajra-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.SAJRA_RELEASE_KEYSTORE_BASE64 != '' && env.SAJRA_RELEASE_STORE_PASSWORD != '' && env.SAJRA_RELEASE_KEY_ALIAS != '' && env.SAJRA_RELEASE_KEY_PASSWORD != '' }}
        run: |
          cd android
          ./gradlew assembleRelease -PsajraVersionCode=${{ github.run_number }} -PsajraVersionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Sajra.apk"
      - uses: actions/upload-artifact@v4
        name: Upload debug APK
        with:
          name: Sajra-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK Release
        if: ${{ env.SAJRA_RELEASE_KEYSTORE_BASE64 != '' && env.SAJRA_RELEASE_STORE_PASSWORD != '' && env.SAJRA_RELEASE_KEY_ALIAS != '' && env.SAJRA_RELEASE_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sajra 1.0.${{ github.run_number }}
          files: ${{ runner.temp }}/Sajra.apk
          make_latest: true
      - name: Authenticate to Firebase for update notification
        if: ${{ env.SAJRA_RELEASE_KEYSTORE_BASE64 != '' && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        id: firebase-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
      - name: Notify Sajra users about the new release
        if: ${{ env.SAJRA_RELEASE_KEYSTORE_BASE64 != '' && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
          SAJRA_VERSION: 1.0.${{ github.run_number }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --url "https://fcm.googleapis.com/v1/projects/sajra-9774e/messages:send" \
            --header "Authorization: Bearer $FIREBASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"message\":{\"topic\":\"sajra_updates\",\"notification\":{\"title\":\"Sajra update available\",\"body\":\"Version $SAJRA_VERSION is ready. Open Sajra and check for updates.\"},\"android\":{\"notification\":{\"channel_id\":\"sajra_updates\"}},\"data\":{\"version\":\"$SAJRA_VERSION\",\"url\":\"https://github.com/larrysm786786/sajra/releases/latest\"}}}"
